<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hospoda AI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1a1a1a;
            --surface-3: #222222;
            --border: #2a2a2a;
            --border-hover: #3a3a3a;
            --white: #ffffff;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-300: #d4d4d4;
            --gray-400: #a3a3a3;
            --gray-500: #737373;
            --gray-600: #525252;
            --orange: #ff6b00;
            --orange-soft: #ff8533;
            --purple: #9333ea;
            --green: #10b981;
            --blue: #3b82f6;
            --red: #ef4444;
            --gradient: linear-gradient(135deg, var(--orange) 0%, var(--purple) 100%);
            --glow-orange: 0 0 60px rgba(255, 107, 0, 0.3);
            --glow-purple: 0 0 60px rgba(147, 51, 234, 0.3);
            --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Ambient Background */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            will-change: transform;
        }

        .orb-1 {
            width: 800px;
            height: 800px;
            background: var(--orange);
            top: -400px;
            right: -300px;
            animation: orb1 25s ease-in-out infinite;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: var(--purple);
            bottom: -200px;
            left: -200px;
            animation: orb2 30s ease-in-out infinite;
        }

        @keyframes orb1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(-100px, 100px) scale(1.1); opacity: 0.6; }
        }

        @keyframes orb2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(80px, -80px) scale(1.15); opacity: 0.5; }
        }

        /* Noise texture overlay */
        .noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Container */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 44px;
            height: 44px;
            background: var(--gradient);
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 22px;
            box-shadow: var(--glow-orange);
            transition: transform 0.3s var(--ease-spring);
        }

        .logo:hover { transform: scale(1.05) rotate(-3deg); }

        .brand {
            flex: 1;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
            padding: 3px 8px;
            background: var(--gradient);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            vertical-align: middle;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        /* Main */
        main {
            padding: 32px 0 140px;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 24px 0 40px;
        }

        .hero-emoji {
            font-size: 72px;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .hero-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .hero-title span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 15px;
            color: var(--gray-400);
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Bento Grid */
        .bento {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s var(--ease);
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        /* AI Card */
        .ai-card {
            position: relative;
            overflow: hidden;
        }

        .ai-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient);
            opacity: 0.5;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .ai-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient);
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 24px;
            position: relative;
        }

        .ai-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            background: var(--gradient);
            border-radius: 20px;
            z-index: -1;
            opacity: 0.3;
            filter: blur(12px);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { opacity: 0.2; transform: scale(0.9); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }

        .ai-info h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .ai-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--green);
        }

        .ai-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Input */
        .input-wrap {
            position: relative;
        }

        .input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 100px 16px 18px;
            font-size: 15px;
            font-family: var(--font);
            color: var(--white);
            transition: all 0.2s var(--ease);
        }

        .input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
        }

        .input::placeholder { color: var(--gray-600); }

        .input-actions {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s var(--ease);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .mic-btn {
            background: var(--surface-3);
            color: var(--gray-400);
        }

        .mic-btn:hover {
            background: var(--border);
            color: var(--white);
        }

        .mic-btn.active {
            background: var(--red);
            color: var(--white);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .send-btn {
            background: var(--gradient);
            color: var(--white);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--glow-orange);
        }

        /* Chips */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font);
            color: var(--gray-300);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .chip:hover {
            background: var(--surface-3);
            border-color: var(--border-hover);
            color: var(--white);
            transform: translateY(-1px);
        }

        .chip svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        /* AI Response */
        .ai-response {
            margin-top: 16px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.08), rgba(147, 51, 234, 0.08));
            border: 1px solid rgba(255, 107, 0, 0.15);
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--gray-200);
            display: none;
        }

        .ai-response.show {
            display: block;
            animation: fadeUp 0.3s var(--ease);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 20px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--orange);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Radius Card */
        .radius-card {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .radius-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-400);
            white-space: nowrap;
        }

        .slider-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--white);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), var(--glow-orange);
            transition: transform 0.2s var(--ease-spring);
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .slider-val {
            min-width: 50px;
            padding: 8px 12px;
            background: var(--surface-2);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--orange);
            text-align: center;
        }

        /* CTA Button */
        .cta {
            width: 100%;
            padding: 18px 24px;
            background: var(--white);
            color: var(--black);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s var(--ease);
            position: relative;
            overflow: hidden;
        }

        .cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
        }

        .cta:hover::before { opacity: 1; }
        .cta:hover { color: var(--white); }

        .cta svg {
            width: 20px;
            height: 20px;
            position: relative;
            z-index: 1;
        }

        .cta span { position: relative; z-index: 1; }

        .cta:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .status.show {
            display: block;
            animation: fadeUp 0.3s var(--ease);
        }

        .status-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .status-text {
            font-size: 14px;
            color: var(--gray-500);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .coords {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            background: var(--surface);
            border-radius: 8px;
            font-size: 11px;
            font-family: 'SF Mono', monospace;
            color: var(--gray-500);
        }

        /* Results */
        .results {
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeUp 0.4s var(--ease);
        }

        .results-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-title {
            font-size: 20px;
            font-weight: 700;
        }

        .results-count {
            padding: 6px 14px;
            background: var(--gradient);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Pub Card */
        .pub {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.3s var(--ease);
            position: relative;
        }

        .pub::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20px;
            bottom: 20px;
            width: 3px;
            background: var(--gradient);
            border-radius: 0 3px 3px 0;
            opacity: 0.7;
        }

        .pub:hover {
            border-color: var(--border-hover);
            transform: translateX(4px);
        }

        .pub.first {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.02));
            border-color: rgba(16, 185, 129, 0.2);
        }

        .pub.first::before {
            background: var(--green);
            opacity: 1;
        }

        .pub-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }

        .pub-rank {
            width: 36px;
            height: 36px;
            background: var(--gradient);
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .pub.first .pub-rank { background: var(--green); }

        .pub-main { flex: 1; min-width: 0; }

        .pub-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .first-badge {
            padding: 3px 10px;
            background: var(--green);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pub-addr {
            font-size: 13px;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pub-addr svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .pub-dist {
            text-align: right;
            flex-shrink: 0;
        }

        .dist-num {
            font-size: 22px;
            font-weight: 800;
            color: var(--orange);
            line-height: 1;
        }

        .pub.first .dist-num { color: var(--green); }

        .dist-unit {
            font-size: 11px;
            color: var(--gray-500);
        }

        /* AI Insight */
        .insight {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.1), rgba(255, 107, 0, 0.05));
            border: 1px solid rgba(147, 51, 234, 0.15);
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .insight-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .insight-text {
            font-size: 12px;
            color: var(--gray-300);
            line-height: 1.4;
        }

        /* Pub Meta */
        .pub-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--gray-500);
        }

        .meta svg {
            width: 14px;
            height: 14px;
            color: var(--orange);
        }

        .meta a {
            color: var(--blue);
            text-decoration: none;
        }

        /* Tags */
        .pub-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag {
            padding: 5px 12px;
            background: var(--surface-2);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--gray-400);
        }

        /* Actions */
        .pub-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s var(--ease);
        }

        .action svg {
            width: 18px;
            height: 18px;
        }

        .action-map {
            background: var(--surface-2);
            color: var(--white);
            border: 1px solid var(--border);
        }

        .action-map:hover {
            background: var(--surface-3);
            border-color: var(--border-hover);
        }

        .action-nav {
            background: var(--white);
            color: var(--black);
        }

        .action-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-box {
            background: var(--surface);
            width: 100%;
            max-width: 520px;
            max-height: 85dvh;
            border-radius: 24px 24px 0 0;
            overflow: hidden;
            animation: modalUp 0.35s var(--ease);
        }

        @keyframes modalUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: var(--surface-2);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: var(--gray-400);
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--red);
            color: var(--white);
        }

        #map { height: 320px; }

        .modal-foot { padding: 20px; }

        /* Responsive */
        @media (max-width: 480px) {
            .hero-title { font-size: 28px; }
            .hero-emoji { font-size: 56px; }
            
            .pub-top { flex-wrap: wrap; }
            
            .pub-dist {
                width: 100%;
                text-align: left;
                display: flex;
                align-items: baseline;
                gap: 6px;
                margin-top: 8px;
            }
            
            .pub-actions { grid-template-columns: 1fr; }
        }

        @media (display-mode: standalone) {
            header { padding-top: calc(env(safe-area-inset-top, 0) + 16px); }
        }

        /* Leaflet dark */
        .leaflet-tile-pane { filter: brightness(0.75) saturate(0.85); }
    </style>
</head>
<body>
    <div class="ambient">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
    </div>
    <div class="noise"></div>

    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">🍺</div>
                <div class="brand">
                    <h1 class="brand-name">Hospoda<span class="brand-tag">AI</span></h1>
                    <p class="brand-sub">Najdi hospodu poblíž</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="hero">
                <span class="hero-emoji">🍻</span>
                <h2 class="hero-title">Kam dneska <span>na pivo?</span></h2>
                <p class="hero-desc">AI ti pomůže najít nejlepší hospodu ve tvém okolí během pár sekund</p>
            </section>

            <!-- Location debug -->
            <div class="card location-card" id="locationCard" style="display:none; margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="font-size: 14px; font-weight: 600;">📍 Tvoje poloha</span>
                    <button onclick="copyCoords()" style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--gray-300); cursor: pointer;">Kopírovat</button>
                </div>
                <div id="locationInfo" style="font-family: monospace; font-size: 13px; color: var(--gray-400); background: var(--surface-2); padding: 12px; border-radius: 10px;"></div>
                <a id="mapLink" href="#" target="_blank" style="display: block; margin-top: 10px; font-size: 13px; color: var(--blue); text-decoration: none;">🗺️ Ověřit na Google Maps</a>
            </div>

            <div class="bento">
                <div class="card ai-card">
                    <div class="ai-header">
                        <div class="ai-icon">✨</div>
                        <div class="ai-info">
                            <h3>AI Asistent</h3>
                            <div class="ai-status">Online</div>
                        </div>
                    </div>

                    <div class="input-wrap">
                        <input type="text" class="input" id="input" placeholder="Napiš co hledáš..." onkeydown="if(event.key==='Enter')send()">
                        <div class="input-actions">
                            <button class="icon-btn mic-btn" id="mic" onclick="toggleMic()">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                            </button>
                            <button class="icon-btn send-btn" onclick="send()">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="chips">
                        <button class="chip" onclick="quick('nearest')">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                            Nejbližší
                        </button>
                        <button class="chip" onclick="quick('garden')">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                            Zahrádka
                        </button>
                        <button class="chip" onclick="quick('open')">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Otevřeno
                        </button>
                    </div>

                    <div class="ai-response" id="response"></div>
                </div>

                <div class="card radius-card">
                    <span class="radius-label">Radius</span>
                    <div class="slider-wrap">
                        <input type="range" class="slider" id="radius" min="500" max="15000" step="500" value="5000" oninput="updateRadius()">
                        <div class="slider-val" id="radiusVal">5 km</div>
                    </div>
                </div>
            </div>

            <button class="cta" id="cta" onclick="find()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span id="ctaText">Najít hospody</span>
            </button>

            <div class="card status" id="status"></div>

            <div class="results" id="results">
                <div class="results-head">
                    <h3 class="results-title">Výsledky</h3>
                    <span class="results-count" id="count">0</span>
                </div>
                <div id="list"></div>
            </div>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 class="modal-title" id="modalTitle">Mapa</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="map"></div>
            <div class="modal-foot">
                <button class="action action-nav" onclick="navModal()" style="width:100%">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                    Otevřít v Google Maps
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let pos = null, pubs = [], current = null, map = null, listening = false, rec = null;

        const AI = {
            greet: ["Ahoj! 👋 Jsem tvůj AI průvodce hospodami. Co to bude?", "Čau! 🍺 Pomůžu ti najít skvělou hospodu.", "Zdravím! Najdeme ti ideální místo na pivo."],
            search: ["🔍 Hledám hospody poblíž...", "⏳ Prohledávám okolí...", "🗺️ Skenuju mapu..."],
            found: ["🎉 Nalezeno {n} hospod! Nejbližší: {name} ({d})", "✅ Mám {n} tipů. {name} je jen {d} daleko!", "🍻 Super! {n} hospod. Doporučuju {name} ({d})"],
            empty: ["😔 V okolí {r} km nic není.", "🤔 Prázdno. Zkus větší radius.", "📍 Žádné hospody. Rozšiř hledání?"],
            garden: "🌿 Hledám hospody se zahrádkou...",
            open: "🕐 Zjišťuji otevřené podniky..."
        };

        const pick = arr => arr[Math.floor(Math.random() * arr.length)];

        function showAI(text, typing = true) {
            const el = document.getElementById('response');
            el.classList.add('show');
            if (typing) {
                el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
                setTimeout(() => el.textContent = text, 700);
            } else {
                el.textContent = text;
            }
        }

        function send() {
            const val = document.getElementById('input').value.trim().toLowerCase();
            if (!val) return;
            document.getElementById('input').value = '';
            
            if (val.includes('ahoj') || val.includes('help')) showAI(pick(AI.greet));
            else if (val.includes('zahrad') || val.includes('venku')) { showAI(AI.garden); setTimeout(() => find('outdoor'), 1000); }
            else if (val.includes('otevř') || val.includes('teď')) { showAI(AI.open); setTimeout(() => find('open'), 1000); }
            else { showAI(pick(AI.search)); setTimeout(() => find(), 1000); }
        }

        function quick(type) {
            if (type === 'nearest') { showAI(pick(AI.search)); setTimeout(() => find(), 800); }
            else if (type === 'garden') { showAI(AI.garden); setTimeout(() => find('outdoor'), 1000); }
            else if (type === 'open') { showAI(AI.open); setTimeout(() => find('open'), 1000); }
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function toggleMic() {
            const btn = document.getElementById('mic');
            const input = document.getElementById('input');
            
            // iOS Safari doesn't support Web Speech API properly
            if (isIOS()) {
                showAI('📱 **iPhone tip:** Hlasové ovládání v Safari nefunguje spolehlivě. Použij raději klávesnici nebo zkus diktování přímo v klávesnici (🎤 na klávesnici).', false);
                
                // Focus input so user can use iOS dictation
                input.focus();
                input.placeholder = 'Použij 🎤 na klávesnici...';
                return;
            }
            
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                showAI('😔 Hlasové ovládání není podporováno v tomto prohlížeči. Zkus Chrome.');
                return;
            }
            
            if (listening) { 
                rec?.stop(); 
                listening = false; 
                btn.classList.remove('active'); 
                return; 
            }
            
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            rec = new SR();
            rec.lang = 'cs-CZ';
            rec.continuous = false;
            rec.interimResults = true;
            rec.maxAlternatives = 1;
            
            rec.onstart = () => { 
                listening = true; 
                btn.classList.add('active'); 
                input.value = '';
                input.placeholder = '🎤 Mluv...';
                showAI('🎤 Poslouchám... Mluv teď!', false); 
            };
            
            rec.onresult = e => {
                let transcript = '';
                let isFinal = false;
                
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    transcript += e.results[i][0].transcript;
                    if (e.results[i].isFinal) {
                        isFinal = true;
                    }
                }
                
                input.value = transcript;
                
                if (isFinal && transcript.trim()) {
                    showAI(`✅ Rozpoznáno: "${transcript}"`, false);
                    setTimeout(() => {
                        send();
                    }, 500);
                }
            };
            
            rec.onerror = (e) => {
                console.error('Speech error:', e.error);
                let msg = '😔 Chyba rozpoznávání.';
                if (e.error === 'no-speech') msg = '🤔 Neslyšel jsem nic. Zkus to znovu.';
                else if (e.error === 'audio-capture') msg = '🎤 Mikrofon není dostupný. Povol přístup.';
                else if (e.error === 'not-allowed') msg = '⚠️ Přístup k mikrofonu zamítnut. Povol ho v nastavení.';
                else if (e.error === 'network') msg = '📶 Chyba sítě. Zkontroluj připojení.';
                showAI(msg, false);
            };
            
            rec.onend = () => { 
                listening = false; 
                btn.classList.remove('active');
                input.placeholder = 'Napiš co hledáš...';
                
                // Check if we got any result
                if (!input.value.trim()) {
                    showAI('🤔 Přepis je prázdný. Zkus mluvit hlasitěji nebo použij klávesnici.', false);
                }
            };
            
            try {
                rec.start();
            } catch (err) {
                showAI('😔 Nepodařilo se spustit mikrofon: ' + err.message, false);
                listening = false;
                btn.classList.remove('active');
            }
        }

        function updateRadius() {
            const v = document.getElementById('radius').value;
            document.getElementById('radiusVal').textContent = (v / 1000).toFixed(1) + ' km';
        }

        function showStatus(icon, title, text, coords = null) {
            const el = document.getElementById('status');
            el.classList.add('show');
            el.innerHTML = `
                ${icon === 'loading' ? '<div class="spinner"></div>' : `<div class="status-icon">${icon}</div>`}
                <div class="status-title">${title}</div>
                <div class="status-text">${text}</div>
                ${coords ? `<div class="coords">📍 ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}</div>` : ''}
            `;
        }

        function hideStatus() { document.getElementById('status').classList.remove('show'); }

        async function find(filter = null) {
            const btn = document.getElementById('cta');
            btn.disabled = true;
            document.getElementById('ctaText').textContent = 'Hledám...';
            document.getElementById('results').classList.remove('show');

            showStatus('loading', 'Zjišťuji polohu...', 'Povol přístup k GPS');

            try {
                pos = await getPos();
                showLocation(pos);
                showStatus('loading', 'Hledám hospody...', 'Analyzuji okolí', pos);

                const r = parseInt(document.getElementById('radius').value);
                pubs = await search(pos.lat, pos.lng, r, filter);

                if (!pubs.length) {
                    showAI(pick(AI.empty).replace('{r}', (r/1000).toFixed(1)));
                    showStatus('😔', 'Nic nenalezeno', `V okruhu ${(r/1000).toFixed(1)} km nejsou hospody.`);
                } else {
                    const top = pubs[0];
                    showAI(pick(AI.found).replace('{n}', pubs.length).replace('{name}', top.name).replace('{d}', fmtDist(top.dist)));
                    hideStatus();
                    render();
                }
            } catch (e) {
                showStatus('😔', 'Chyba', e.message);
                showAI('😔 ' + e.message);
            } finally {
                btn.disabled = false;
                document.getElementById('ctaText').textContent = 'Najít hospody';
            }
        }

        function getPos() {
            return new Promise((res, rej) => {
                if (!navigator.geolocation) { rej(new Error('Geolokace není podporována')); return; }
                navigator.geolocation.getCurrentPosition(
                    p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
                    e => rej(new Error(['', 'Přístup zamítnut', 'Poloha nedostupná', 'Timeout'][e.code] || 'Chyba')),
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            });
        }

        async function search(lat, lng, radius, filter) {
            const q = `[out:json][timeout:25];(node["amenity"~"pub|bar|biergarten"](around:${radius},${lat},${lng});way["amenity"~"pub|bar|biergarten"](around:${radius},${lat},${lng}););out center;`;
            const formData = new URLSearchParams();
            formData.append('data', q);
            const res = await fetch('https://overpass-api.de/api/interpreter', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData 
            });
            if (!res.ok) throw new Error('Chyba načítání (API nedostupné)');
            const data = await res.json();
            
            let results = data.elements.map(el => {
                const t = el.tags || {};
                const pLat = el.lat || el.center?.lat;
                const pLng = el.lon || el.center?.lon;
                return {
                    id: el.id,
                    name: t.name || 'Neznámá hospoda',
                    lat: pLat, lng: pLng,
                    addr: fmtAddr(t),
                    type: { pub: 'Hospoda', bar: 'Bar', biergarten: 'Pivní zahrada' }[t.amenity] || 'Podnik',
                    phone: t.phone || t['contact:phone'],
                    hours: t.opening_hours,
                    outdoor: t.outdoor_seating === 'yes' || t.beer_garden === 'yes',
                    wheelchair: t.wheelchair === 'yes',
                    dist: calcDist(lat, lng, pLat, pLng),
                    tip: genTip(t)
                };
            });
            if (filter === 'outdoor') results = results.filter(p => p.outdoor);
            return results.sort((a, b) => a.dist - b.dist);
        }

        function fmtAddr(t) {
            const p = [];
            if (t['addr:street']) p.push(t['addr:street'] + (t['addr:housenumber'] ? ' ' + t['addr:housenumber'] : ''));
            if (t['addr:city']) p.push(t['addr:city']);
            return p.join(', ') || 'Adresa neznámá';
        }

        function calcDist(lat1, lng1, lat2, lng2) {
            const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function fmtDist(km) { return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'; }

        function genTip(t) {
            if (t.outdoor_seating === 'yes') return 'Má venkovní posezení! ☀️';
            if (t.wheelchair === 'yes') return 'Bezbariérový přístup ♿';
            if (t.cuisine) return `Nabízí ${t.cuisine} jídlo 🍽️`;
            return pick(['Oblíbené místo místních 👍', 'Stojí za návštěvu 🍺', 'Klasika s dobrou atmosférou 🏠']);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function render() {
            document.getElementById('count').textContent = pubs.length + ' hospod';
            document.getElementById('results').classList.add('show');
            document.getElementById('list').innerHTML = pubs.map((p, i) => {
                const first = i === 0;
                const tags = [p.type];
                if (p.outdoor) tags.push('Zahrádka');
                if (p.wheelchair) tags.push('Bezbariérový');
                return `
                <div class="pub ${first ? 'first' : ''}">
                    <div class="pub-top">
                        <span class="pub-rank">${i + 1}</span>
                        <div class="pub-main">
                            <div class="pub-name">${esc(p.name)}${first ? '<span class="first-badge">Nejbližší</span>' : ''}</div>
                            <div class="pub-addr"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>${esc(p.addr)}</div>
                        </div>
                        <div class="pub-dist">
                            <div class="dist-num">${fmtDist(p.dist).split(' ')[0]}</div>
                            <div class="dist-unit">${fmtDist(p.dist).split(' ')[1]}</div>
                        </div>
                    </div>
                    <div class="insight"><span class="insight-icon">✨</span><span class="insight-text">${esc(p.tip)}</span></div>
                    ${p.phone || p.hours ? `<div class="pub-meta">${p.phone ? `<span class="meta"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg><a href="tel:${p.phone}">${esc(p.phone)}</a></span>` : ''}${p.hours ? `<span class="meta"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${esc(p.hours)}</span>` : ''}</div>` : ''}
                    <div class="pub-tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
                    <div class="pub-actions">
                        <button class="action action-map" onclick="showMap(${i})"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>Mapa</button>
                        <button class="action action-nav" onclick="nav(${i})"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>Navigovat</button>
                    </div>
                </div>`;
            }).join('');
        }

        function showMap(i) {
            current = pubs[i];
            document.getElementById('modalTitle').textContent = current.name;
            document.getElementById('modal').classList.add('show');
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([current.lat, current.lng], 16);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OSM © CARTO' }).addTo(map);
                } else map.setView([current.lat, current.lng], 16);
                map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
                const pubIcon = L.divIcon({ html: '<div style="background:linear-gradient(135deg,#ff6b00,#9333ea);width:36px;height:36px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 16px rgba(0,0,0,0.4);">🍺</div>', iconSize: [36, 36], className: '' });
                L.marker([current.lat, current.lng], { icon: pubIcon }).addTo(map).bindPopup(`<b>${current.name}</b><br>${current.addr}`).openPopup();
                if (pos) {
                    const userIcon = L.divIcon({ html: '<div style="background:#3b82f6;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>', iconSize: [14, 14], className: '' });
                    L.marker([pos.lat, pos.lng], { icon: userIcon }).addTo(map).bindPopup('Ty');
                }
                map.invalidateSize();
            }, 100);
        }

        function nav(i) { const p = pubs[i]; window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`, '_blank'); }
        function navModal() { if (current) nav(pubs.indexOf(current)); }
        function closeModal() { document.getElementById('modal').classList.remove('show'); }
        document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

        updateRadius();
        setTimeout(() => showAI(pick(AI.greet)), 500);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

        function showLocation(coords) {
            document.getElementById('locationCard').style.display = 'block';
            document.getElementById('locationInfo').innerHTML = `Lat: ${coords.lat.toFixed(6)}<br>Lng: ${coords.lng.toFixed(6)}`;
            document.getElementById('mapLink').href = `https://www.google.com/maps?q=${coords.lat},${coords.lng}`;
        }

        function copyCoords() {
            if (pos) {
                navigator.clipboard.writeText(`${pos.lat}, ${pos.lng}`);
                showAI('📋 Souřadnice zkopírovány!', false);
            }
        }
    </script>
</body>
</html>
